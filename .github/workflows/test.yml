name: test

on:
  push:
    branches-ignore: [spilldata, hd-mod, gpt-arbeid]
  pull_request:

jobs:
  nettleser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lokale filer, personvern og Pages-prefiks
        run: node --test engine/pages/tests/*.test.mjs
      - name: Kontroller Pages-pakkeren
        run: |
          python3 -m py_compile engine/build-pages.py
          python3 engine/tests/test-build-pages.py -v
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pipelinen
        run: pip install -e "pipeline[dev]"
      - name: Tester uten spillfiler
        working-directory: pipeline
        run: pytest -m "not game" -q
      # Spillfilene, moden og arbeidsbordet ligger i main (Tom 14. oktober 2026). work/ lages
      # på maskinen og sjekkes ikke inn, og ingen fil over 90 MB (GitHub stopper ved 100 MB).
      - name: Ingen work/ og ingen fil over 90 MB
        run: |
          if git ls-files | grep -E '^work/'; then
            echo "work/ er sjekket inn"; exit 1
          fi
          stor=$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 94371840')
          if [ -n "$stor" ]; then echo "Filer over 90 MB:"; echo "$stor"; exit 1; fi
      - name: Skallskriptene
        run: for f in spill.sh engine/*.sh tools/*.sh; do bash -n "$f"; done
      # git apply godtar en patch med for lave tall i hunk-hodene og kutter filene uten feil
      # (fletting i GitHub 13. oktober 2026). Denne sjekken stopper det.
      - name: Hunk-hodene i motorpatchene
        run: python3 tools/sjekk_patcher.py
